<style>
:root{--bg:#f3f1ec;--panel:#fffffff0;--ink:#222;--muted:#666;--line:#d8d4cc;--ok:#1f7a3a;--bad:#b3261e}
*{box-sizing:border-box}html,body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:13px system-ui,-apple-system,"PingFang SC",sans-serif}
#bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
#bar select,#bar button,#bar input{font:inherit;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
#bar label{display:flex;align-items:center;gap:3px}
#legend span{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 8px;vertical-align:-1px}
#grid{display:grid;gap:6px;padding:6px;flex:1;min-height:0}
#panesel{display:flex;gap:8px}
.pane{position:relative;background:#faf9f6;border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:200px}
.pane canvas{display:block;width:100%;height:100%}
.head{position:absolute;left:8px;top:6px;max-width:calc(100% - 16px);pointer-events:none;background:var(--panel);border-radius:6px;padding:4px 8px;line-height:1.5}
.head b{font-size:14px}.ok{color:var(--ok)}.bad{color:var(--bad)}.muted{color:var(--muted)}
.none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--bad);font-size:15px;padding:20px;text-align:center}
#tip{position:fixed;pointer-events:none;background:#222;color:#fff;padding:3px 7px;border-radius:5px;font-size:12px;display:none;z-index:5}
@media (max-width:800px){#grid{grid-template-columns:1fr!important;height:auto}.pane{height:70vh}}

const COLORS = [0x4d80cc, 0xe08a2e, 0x3aa35b, 0xd6336c];

let views = [], syncing = false;

function wallsOf(r, low) {
  const g = new THREE.Group(), poly = r.floor, n = poly.length, H = low ? .5 : r.h;
  let area = 0; for (let i = 0; i < n; i++) { const a = poly[i], b = poly[(i + 1) % n]; area += a[0] * b[1] - b[0] * a[1]; }
  const shape = new THREE.Shape(poly.map(([x, y]) => new THREE.Vector2(x, y)));
  const floor = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshLambertMaterial({color: 0xe9e2d4, side: THREE.DoubleSide}));
  floor.rotation.x = -Math.PI / 2; g.add(floor);   // plan (x, y) -> world (x, 0, -y)
  for (let i = 0; i < n; i++) {
    const a = poly[i], b = poly[(i + 1) % n], L = Math.hypot(b[0] - a[0], b[1] - a[1]); if (L < 1e-6) continue;
    const m = new THREE.Mesh(new THREE.BoxGeometry(L, H, .06), new THREE.MeshLambertMaterial({color: 0xcfc6b6, transparent: true, opacity: low ? .9 : .35}));
    m.position.set((a[0] + b[0]) / 2, H / 2, -(a[1] + b[1]) / 2); m.rotation.y = Math.atan2(b[1] - a[1], b[0] - a[0]); g.add(m);
  }
  for (const [type, wi, pos, w, hgt, sill] of r.openings) {
    if (wi >= n) continue;
    const a = poly[wi], b = poly[(wi + 1) % n], L = Math.hypot(b[0] - a[0], b[1] - a[1]), ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L;
    const c = pos * L, x = a[0] + ux * c, y = a[1] + uy * c, door = type === 'door';
    const hh = door ? Math.min(hgt || 2.1, low ? .6 : 2.1) : (low ? .15 : hgt), z0 = door ? 0 : (low ? .5 : sill);
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, hh, .1), new THREE.MeshLambertMaterial({color: door ? 0x8b6546 : 0x9fd0f0}));
    m.position.set(x, z0 + hh / 2, -y); m.rotation.y = Math.atan2(uy, ux); g.add(m);
  }
  return g;
}
function box([x, y, z, sx, sy, sz, yaw], color, opacity, name) {
  const geo = new THREE.BoxGeometry(sx, Math.max(sz, .01), sy);
  const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({color, transparent: opacity < 1, opacity}));
  m.position.set(x, z + Math.max(sz, .01) / 2, -y); m.rotation.y = yaw;
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({color: 0x333333, transparent: true, opacity: .45}));
  m.add(e); m.userData.name = name; return m;
}
function fmt(s, why) {
  if (!s) return `<span class="bad">没有结果：${(why || '').slice(0, 80)}</span>`;
  const t = (ok, a, b) => `<span class="${ok ? 'ok' : 'bad'}">${a}</span>${b ? ' ' + b : ''}`;
  return [t(s.legal, s.legal ? '合法' : '不合法', `碰撞 ${s.col} · 出界 ${s.oob} · 挡门 ${s.opc}`),

}
function build() {

    scene.add(wallsOf(r, low));
    const pick = [];
    for (const f of r.fixed) scene.add(box(f, 0x8a8a8a, .85, '固定物'));

    const camera = new THREE.PerspectiveCamera(45, 1, .05, 300);
    const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(cx, 0, -cy);

function resize() { for (const v of views) { const w = v.div.clientWidth, h = v.div.clientHeight; v.renderer.setSize(w, h, false); v.camera.aspect = w / h; v.camera.updateProjectionMatrix(); } }
