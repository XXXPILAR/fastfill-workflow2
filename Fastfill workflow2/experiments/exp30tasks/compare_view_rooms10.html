<style>
:root{--bg:#f3f1ec;--panel:#fffffff0;--ink:#222;--muted:#666;--line:#d8d4cc;--ok:#1f7a3a;--bad:#b3261e}
*{box-sizing:border-box}html,body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:13px system-ui,-apple-system,"PingFang SC",sans-serif}
#bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
#bar select,#bar button,#bar input{font:inherit;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
#bar label{display:flex;align-items:center;gap:3px}
#legend span{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 8px;vertical-align:-1px}
#grid{display:grid;gap:6px;padding:6px;flex:1;min-height:0}
#panesel{display:flex;gap:8px}
.pane{position:relative;background:#faf9f6;border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:200px}
.pane canvas{display:block;width:100%;height:100%}
.head{position:absolute;left:8px;top:6px;max-width:calc(100% - 16px);pointer-events:none;background:var(--panel);border-radius:6px;padding:4px 8px;line-height:1.5}
.head b{font-size:14px}.ok{color:var(--ok)}.bad{color:var(--bad)}.muted{color:var(--muted)}
.none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--bad);font-size:15px;padding:20px;text-align:center}
#tip{position:fixed;pointer-events:none;background:#222;color:#fff;padding:3px 7px;border-radius:5px;font-size:12px;display:none;z-index:5}
@media (max-width:800px){#grid{grid-template-columns:1fr!important;height:auto}.pane{height:70vh}}
